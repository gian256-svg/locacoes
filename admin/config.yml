# =====================================================================
# PAINEL (Sveltia CMS) — define o que pode ser editado em /admin
# =====================================================================

backend:
  name: github
  repo: gian256-svg/locacoes
  branch: main
  auth_methods: [oauth, token]
  base_url: https://locacoes-1cq.pages.dev # login com GitHub (functions/api/auth.js)
  auth_endpoint: api/auth
  commit_messages:
    create: "Painel: nova locação {{slug}}"
    update: "Painel: atualiza {{slug}}"
    delete: "Painel: remove {{slug}}"
    uploadMedia: "Painel: envia {{path}}"
    deleteMedia: "Painel: remove {{path}}"

site_url: https://locacoes-1cq.pages.dev
display_url: https://locacoes-1cq.pages.dev

media_folder: /assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      max_file_size: 20971520 # 20 MB (limite da hospedagem gratuita é 25 MB por arquivo)
      slugify_filename: true
      # Fotos são reduzidas no próprio navegador antes de enviar (salvar fica rápido,
      # mesmo no celular). Na publicação são otimizadas de novo (scripts/build.mjs).
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1800
          height: 1800

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # ==================================================================
  # LOCAÇÕES
  # ==================================================================
  - name: locacoes
    label: Locações
    label_singular: Locação
    description: Cada item é uma locação exibida no site.
    folder: content/locacoes
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: nome
    slug: "{{nome}}"
    summary: "{{nome}} · {{cidade}}"
    sortable_fields: [ordem, nome, cidade]
    view_groups:
      - { label: Cidade, field: cidade }
    editor:
      preview: false
    fields:
      - { name: nome, label: Nome da locação, widget: string, hint: "Aparece em cima da foto principal." }
      - name: visivel
        label: Visível no site
        widget: boolean
        default: true
        hint: "Desligue para esconder sem apagar."
      - name: ordem
        label: Ordem
        widget: number
        value_type: int
        default: 100
        hint: "Números menores aparecem primeiro (10, 20, 30...)."
      - name: cidade
        label: Cidade
        widget: relation
        collection: configuracoes
        file: cidades
        value_field: "cidades.*.nome"
        display_fields: ["cidades.*.nome"]
        search_fields: ["cidades.*.nome"]
        hint: "Para criar uma cidade nova, vá em Configurações › Cidades."
      - { name: bairro, label: Bairro / região, widget: string, required: false }
      - { name: selo, label: Selo (opcional), widget: string, required: false, hint: "Etiqueta dourada sobre a foto, ex: Novo, Destaque." }
      - { name: capa, label: Foto principal (capa), widget: image, hint: "Foto exibida na página inicial. Prefira fotos em pé." }
      - { name: resumo, label: Resumo, widget: text, required: false, hint: "Uma frase curta." }
      - { name: descricao, label: Descrição completa, widget: text, required: false, hint: "Deixe uma linha em branco para separar parágrafos." }
      - name: infos
        label: Informações importantes
        label_singular: informação
        widget: list
        required: false
        summary: "{{fields.rotulo}} {{fields.valor}}"
        hint: "Todos os campos são opcionais: preencha só o que quiser mostrar."
        fields:
          - name: icone
            label: Ícone
            widget: select
            required: false
            default: check
            options:
              - { label: "Área (m²)", value: area }
              - { label: "Pessoas / capacidade", value: pessoas }
              - { label: "Preço", value: preco }
              - { label: "Horário", value: relogio }
              - { label: "Luz natural", value: luz }
              - { label: "Localização", value: local }
              - { label: "Estacionamento", value: carro }
              - { label: "Câmera / ideal para", value: camera }
              - { label: "Energia", value: energia }
              - { label: "Check (genérico)", value: check }
          - { name: rotulo, label: "Título (ex: Área)", widget: string, required: false }
          - { name: valor, label: "Valor (ex: 300 m²)", widget: string, required: false }
      - name: fotos
        label: Fotos da galeria
        widget: image
        multiple: true
        required: false
        hint: "Selecione várias fotos de uma vez. Arraste para mudar a ordem."
      - name: videos
        label: Vídeos
        label_singular: vídeo
        widget: list
        required: false
        summary: "{{fields.titulo}} {{fields.link}}"
        fields:
          - name: link
            label: Link do vídeo
            widget: string
            required: false
            hint: "YouTube (pode ser 'Não listado'), Vimeo ou Google Drive. Preencha este OU envie um arquivo abaixo."
          - name: arquivo
            label: OU envie um arquivo de vídeo
            widget: file
            required: false
            accept: "video/*"
            hint: "MP4 de até 20 MB. Para vídeos maiores, use o YouTube."
          - { name: titulo, label: Título (opcional), widget: string, required: false }
          - { name: vertical, label: Vídeo em pé (gravado no celular), widget: boolean, default: false, required: false }

  # ==================================================================
  # CONFIGURAÇÕES
  # ==================================================================
  - name: configuracoes
    label: Configurações
    editor:
      preview: false
    files:
      # ---------------------------------------------------------------
      - name: cidades
        label: Cidades
        description: Cidades exibidas no site. A ordem aqui é a ordem na página.
        file: content/cidades.json
        format: json
        fields:
          - name: cidades
            label: Cidades
            label_singular: cidade
            widget: list
            summary: "{{fields.nome}}"
            hint: "Arraste para mudar a ordem. Desligue 'Visível' para esconder a cidade e todas as locações dela."
            fields:
              - { name: nome, label: Nome da cidade, widget: string }
              - { name: subtitulo, label: Subtítulo (opcional), widget: string, required: false, hint: "Texto pequeno abaixo do nome da cidade." }
              - { name: visivel, label: Visível, widget: boolean, default: true }

      # ---------------------------------------------------------------
      - name: site
        label: Aparência, textos e contato
        file: content/site.json
        format: json
        fields:
          - name: marca
            label: Marca
            widget: object
            collapsed: true
            fields:
              - { name: nome, label: Nome, widget: string, required: false, hint: "Deixe vazio para esconder." }
              - { name: slogan, label: Slogan, widget: string, required: false, hint: "Deixe vazio para esconder." }
              - { name: logo, label: "Logo (opcional, substitui o nome)", widget: image, required: false }

          - name: cores
            label: Cores
            widget: object
            collapsed: true
            fields:
              - { name: fundo, label: Fundo principal, widget: color, default: "#0b0b0b" }
              - { name: fundoSecundario, label: Fundo das faixas e rodapé, widget: color, default: "#121212" }
              - { name: superficie, label: Fundo das caixas, widget: color, default: "#181818" }
              - { name: destaque, label: Dourado principal, widget: color, default: "#c9a45c" }
              - { name: destaqueClaro, label: Dourado claro (brilho), widget: color, default: "#ead7a4" }
              - { name: destaqueEscuro, label: Dourado escuro (sombra), widget: color, default: "#8c6a2f" }
              - { name: texto, label: Texto principal, widget: color, default: "#f2ede3" }
              - { name: textoSuave, label: Texto secundário, widget: color, default: "#9d978b" }

          - name: fontes
            label: Fontes
            widget: object
            collapsed: true
            fields:
              - name: titulos
                label: Fonte dos títulos
                widget: select
                default: Cormorant Garamond
                options: [Cormorant Garamond, Playfair Display, Cinzel, Bodoni Moda, Marcellus, Italiana, Libre Baskerville, DM Serif Display]
              - name: texto
                label: Fonte do texto
                widget: select
                default: Montserrat
                options: [Montserrat, Jost, Raleway, Lato, Poppins, Inter, Nunito Sans, Josefin Sans]
              - { name: tamanhoBase, label: Tamanho do texto (px), widget: number, value_type: int, min: 13, max: 20, default: 16 }
              - { name: titulosEmMaiusculas, label: Títulos em CAIXA ALTA, widget: boolean, default: false }

          - name: textos
            label: Textos do site
            widget: object
            collapsed: true
            hint: "Apague qualquer texto para escondê-lo do site."
            fields:
              - { name: eyebrow, label: "Início — linha pequena acima do título", widget: string, required: false }
              - { name: titulo, label: "Início — título principal", widget: string, required: false }
              - { name: subtitulo, label: "Início — subtítulo", widget: string, required: false }
              - { name: filtroTodas, label: "Início — botão de filtro 'Todas'", widget: string, required: false, hint: "Vazio = sem o botão 'Todas' (começa na primeira cidade)." }
              - { name: botaoVerLocacao, label: "Cartão — texto 'Ver locação' (ao passar o mouse)", widget: string, required: false }
              - { name: maisInfos, label: "Cartão — texto '+ informações'", widget: string, required: false, hint: "Aparece quando as informações no cartão estão desligadas." }
              - { name: semLocacoes, label: "Início — mensagem quando não há locações", widget: string, required: false }
              - { name: voltar, label: "Locação — botão voltar", widget: string, required: false }
              - { name: tituloSobre, label: "Locação — título 'Sobre o espaço'", widget: string, required: false }
              - { name: tituloInfos, label: "Locação — título 'Informações'", widget: string, required: false }
              - { name: tituloVideo, label: "Locação — título 'Vídeo'", widget: string, required: false }
              - { name: tituloFotos, label: "Locação — título 'Galeria'", widget: string, required: false }
              - { name: verTodasFotos, label: "Locação — botão 'Ver todas as fotos'", widget: string, required: false }
              - { name: outrasLocacoes, label: "Locação — título 'Outras locações'", widget: string, required: false }
              - { name: naoEncontrado, label: "Mensagem de locação não encontrada", widget: string, required: false }
              - { name: ctaTitulo, label: "Caixa de contato — título", widget: string, required: false }
              - { name: ctaTexto, label: "Caixa de contato — texto", widget: text, required: false }
              - { name: ctaBotao, label: "Caixa de contato — botão", widget: string, required: false }
              - { name: rodape, label: "Rodapé — texto", widget: string, required: false }

          - name: layout
            label: Layout e exibição
            widget: object
            collapsed: true
            fields:
              - { name: colunasDesktop, label: Fotos por linha (computador), widget: select, options: [{label: "2", value: 2}, {label: "3", value: 3}, {label: "4", value: 4}], default: 3 }
              - name: formatoCapa
                label: Formato da foto principal
                widget: select
                default: "4/5"
                options:
                  - { label: "Retrato (4:5)", value: "4/5" }
                  - { label: "Retrato alto (2:3)", value: "2/3" }
                  - { label: "Quadrada (1:1)", value: "1/1" }
                  - { label: "Paisagem (3:2)", value: "3/2" }
                  - { label: "Paisagem larga (16:9)", value: "16/9" }
              - { name: cantosArredondados, label: Arredondamento das bordas (px), widget: number, value_type: int, min: 0, max: 30, default: 6 }
              - name: posicaoNome
                label: Posição do nome da locação
                widget: select
                default: acima
                options:
                  - { label: "Acima da foto", value: acima }
                  - { label: "Abaixo da foto", value: abaixo }
                  - { label: "Sobre a foto", value: sobre }
              - { name: mostrarBairroNoCard, label: Mostrar bairro ao lado do nome, widget: boolean, default: true }
              - { name: mostrarInfosNoCard, label: Mostrar informações abaixo da foto (página inicial), widget: boolean, default: true }
              - { name: quantidadeInfosNoCard, label: Quantas informações mostrar no cartão, widget: number, value_type: int, min: 0, max: 6, default: 3 }
              - { name: mostrarResumoNoCard, label: Mostrar resumo no cartão, widget: boolean, default: false }
              - { name: agruparPorCidade, label: Separar por cidade, widget: boolean, default: true }
              - { name: mostrarQuantidadePorCidade, label: "Mostrar quantidade ('4 locações') ao lado da cidade", widget: boolean, default: true }
              - { name: mostrarFiltroCidades, label: Botões de filtro por cidade, widget: boolean, default: true }
              - { name: carrosselNoCelular, label: Fotos deslizantes no celular, widget: boolean, default: true }
              - name: ordemPaginaLocal
                label: Seções da página da locação (na ordem)
                widget: list
                hint: "Arraste para reordenar. Remova uma seção para escondê-la."
                field:
                  name: secao
                  label: Seção
                  widget: select
                  options:
                    - { label: "Mosaico de fotos", value: mosaico }
                    - { label: "Descrição, informações e contato", value: informacoes }
                    - { label: "Vídeo", value: video }
                    - { label: "Galeria completa", value: galeria }
                    - { label: "Outras locações", value: outras }
              - { name: incluirCapaNaGaleria, label: Incluir a capa na galeria, widget: boolean, default: true }
              - { name: quantidadeOutras, label: Quantidade de "outras locações", widget: number, value_type: int, min: 0, max: 6, default: 3 }
              - { name: mostrarCaixaContato, label: Mostrar caixa "Gostou deste local?", widget: boolean, default: true }
              - { name: mostrarContatoNoTopo, label: Mostrar ícones de contato no topo, widget: boolean, default: true }
              - { name: mostrarRodape, label: Mostrar rodapé, widget: boolean, default: true }
              - { name: mostrarOrnamentos, label: Mostrar ornamentos dourados (linhas com losango), widget: boolean, default: true }
              - { name: animacoes, label: Animações suaves, widget: boolean, default: true }

          - name: contato
            label: Contato
            widget: object
            collapsed: true
            fields:
              - { name: whatsapp, label: "WhatsApp (só números, com 55 + DDD)", widget: string, required: false, hint: "Ex: 5511999999999. Vazio = esconde." }
              - { name: mensagemWhatsapp, label: Mensagem automática do WhatsApp, widget: string, required: false, hint: "{local} é trocado pelo nome da locação." }
              - { name: instagram, label: Instagram, widget: string, required: false, hint: "Ex: @seuperfil. Vazio = esconde." }
              - { name: email, label: E-mail, widget: string, required: false, hint: "Vazio = esconde." }

          - name: protecao
            label: Proteção das fotos
            widget: object
            collapsed: true
            fields:
              - { name: bloquearCliqueDireito, label: Bloquear clique direito nas fotos, widget: boolean, default: true }
              - { name: bloquearArrastarImagens, label: Bloquear arrastar fotos, widget: boolean, default: true }

          - name: seo
            label: Privacidade
            widget: object
            collapsed: true
            fields:
              - { name: ocultarDoGoogle, label: Ocultar o site do Google (só acessa quem tem o link), widget: boolean, default: true }
